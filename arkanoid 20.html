<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический Арканоид</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050005;
            font-family: 'Arial', sans-serif;
            color: #C0C0C0; /* Silver */
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-size: 18px;
            text-shadow: 0 0 10px #CFB53B; /* Muted Gold */
        }
        #score {
            margin-bottom: 10px;
        }
        #combo {
            color: #CFB53B; /* Muted Gold */
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div id="score">Счёт: 0</div>
            <div id="combo">Комбо: 0</div>
            <div id="speed">Скорость: 1.0x</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === КОНФИГУРАЦИЯ ===
        const CONFIG = {
            // Музыкальные скейлы (в MIDI нотах)
            SCALES: {
                'C Minor': [60, 62, 63, 65, 67, 68, 69, 71], // C, D, Eb, F, G, Ab, Bb, B
                'G Natural Minor': [67, 69, 70, 72, 74, 75, 77, 79], // G, A, Bb, C, D, Eb, F, G
                'A Mixolydian': [69, 71, 72, 74, 76, 77, 79, 81], // A, B, C, D, E, F, G, A
                'D Locrian': [62, 63, 65, 66, 69, 70, 71, 73] // D, Eb, F, Gb, A, Bb, B, C
            },
            WALL_NOTES: [60, 62, 64, 65, 67, 69], // C, D, E, F, G, A
            WALL_ZONES: 6,
            BALL_BASE_SPEED: 0.09, // 0.1125 * 0.8
            SPEED_INCREASE: 0.003, // 0.00375 * 0.8
            MAX_SPEED: 0.24, // 0.3 * 0.8
            BOUNCE_RANDOMNESS: 0.1 // 10% randomness
        };

        // === ИГРОВЫЕ ПЕРЕМЕННЫЕ ===
        let scene, camera, renderer;
        let ball, paddle, bricks = [];
        let ballVelocity = { x: 0, y: 0 };
        let isBallLaunched = false;
        let keys = {};
        let score = 0;
        let combo = 0;
        let gameTime = 0;
        let currentScale = 'C Minor';
        let audioContext;
        let activeNotes = [];
        let delay, feedbackGain, delayInputGain, limiter;
        let brickTextures = [];

        const SVG_DATA = [
            // 1. Волк в золотых очках
            '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="48" fill="#9B1C1C" stroke="#D2AA46" stroke-width="4"/><path d="M20 30 Q50 0 80 30 Q90 60 70 90 L30 90 Q10 60 20 30Z" fill="#444"/><rect x="25" y="40" width="20" height="12" fill="#FFD700"/><rect x="55" y="40" width="20" height="12" fill="#FFD700"/></svg>',
            // 2. Подиум с логотипом Gucci
            '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="100" fill="#0A3D2E"/><text x="50" y="55" font-size="20" fill="#D2AA46" font-family="serif" text-anchor="middle">GUCCI</text><rect x="10" y="70" width="80" height="10" fill="#9B1C1C"/></svg>',
            // 3. Волк отбивает шар
            '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="100" fill="#111"/><circle cx="50" cy="20" r="6" fill="#D2AA46"/><rect x="35" y="80" width="30" height="6" fill="#9B1C1C" stroke="#D2AA46" stroke-width="2"/><path d="M20 50 Q10 40 20 30 Q30 20 40 30 Q50 40 40 50 Z" fill="#555"/></svg>',
            // 4. Золотая подиумная лампа
            '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="60" width="20" height="30" fill="#D2AA46"/><circle cx="50" cy="40" r="20" fill="#FFD700" stroke="#D2AA46" stroke-width="4"/><line x1="50" y1="20" x2="50" y2="0" stroke="#D2AA46" stroke-width="3"/></svg>',
            // 5. Щит с двойной G
            '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="#9B1C1C" stroke="#D2AA46" stroke-width="4"/><path d="M35 30 A15 15 0 1 1 35 70 M65 30 A15 15 0 1 0 65 70" stroke="#D2AA46" stroke-width="3" fill="none"/></svg>'
        ];

        // === ИНИЦИАЛИЗАЦИЯ ===
        function init() {
            // Создание аудио контекста
            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // --- Master Limiter Setup ---
            limiter = audioContext.createDynamicsCompressor();
            limiter.threshold.value = -5;
            limiter.knee.value = 0;
            limiter.ratio.value = 20;
            limiter.attack.value = 0.001;
            limiter.release.value = 0.1;
            limiter.connect(audioContext.destination);
            // --- End Master Limiter Setup ---

            // --- Tape Delay Setup ---
            delay = audioContext.createDelay(6.0); // Max delay 6s, for wider modulation
            feedbackGain = audioContext.createGain();
            delayInputGain = audioContext.createGain();

            delay.delayTime.value = 3.0;
            feedbackGain.gain.value = 0.61;

            // Feedback loop
            delayInputGain.connect(delay);
            delay.connect(feedbackGain);
            feedbackGain.connect(delay);

            // Output delay to destination
            delay.connect(limiter);
            // --- End Tape Delay Setup ---

            // Создание сцены
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0521); // Dark Indigo/Velvet
            
            // Камера
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('gameContainer').appendChild(renderer.domElement);

            // Создание игровых объектов
            createBall();
            createPaddle();
            createWalls();
            createBricks();

            // События
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
                if (e.code === 'Space' && !isBallLaunched) {
                    isBallLaunched = true;
                    ballVelocity = {
                        x: (Math.random() - 0.5) * CONFIG.BALL_BASE_SPEED * 2,
                        y: CONFIG.BALL_BASE_SPEED
                    };
                }
            });
            window.addEventListener('keyup', (e) => keys[e.key] = false);
            window.addEventListener('resize', onWindowResize);

            resetBall(); // Set initial state

            // --- Asynchronously Load SVG Textures and Apply to Bricks ---
            SVG_DATA.forEach((svgString, index) => {
                const image = new Image();
                image.onload = () => {
                    const texture = new THREE.CanvasTexture(image);
                    texture.needsUpdate = true;

                    bricks.forEach(brick => {
                        if (brick.userData.textureIndex === index) {
                            brick.material.map = texture;
                            brick.material.opacity = 1;
                            brick.material.needsUpdate = true;
                        }
                    });
                };
                image.src = `data:image/svg+xml;base64,${btoa(svgString)}`;
            });

            // Запуск игры
            animate();
        }

        // === СОЗДАНИЕ ОБЪЕКТОВ ===
        function createBall() {
            const geometry = new THREE.SphereGeometry(0.1, 16, 16);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0xF5F5DC, // Pearly white
                emissive: 0xF5F5DC,
                emissiveIntensity: 0.5
            });
            ball = new THREE.Mesh(geometry, material);
            ball.position.set(0, -2, 0);
            scene.add(ball);
        }

        function createPaddle() {
            const geometry = new THREE.BoxGeometry(1, 0.1, 0.1);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0xCFB53B, // Muted Gold
                emissive: 0xCFB53B,
                emissiveIntensity: 0.3
            });
            paddle = new THREE.Mesh(geometry, material);
            paddle.position.set(0, -3.5, 0);
            scene.add(paddle);
        }

        function createWalls() {
            // Верхняя и нижняя стены
            const wallGeometry = new THREE.BoxGeometry(8, 0.2, 0.1);
            const wallMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x333333, // Dark Grey
                emissive: 0x333333,
                emissiveIntensity: 0.2
            });

            const topWall = new THREE.Mesh(wallGeometry, wallMaterial);
            topWall.position.set(0, 4, 0);
            scene.add(topWall);

            const bottomWall = new THREE.Mesh(wallGeometry, wallMaterial);
            bottomWall.position.set(0, -4, 0);
            scene.add(bottomWall);

            // Левые и правые стены
            const sideWallGeometry = new THREE.BoxGeometry(0.2, 8, 0.1);
            const leftWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            leftWall.position.set(-4, 0, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            rightWall.position.set(4, 0, 0);
            scene.add(rightWall);
        }

        function createBricks() {
            const brickGeometry = new THREE.BoxGeometry(0.8, 0.3, 0.1);

            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 8; col++) {
                    // Start with a transparent material
                    const material = new THREE.MeshBasicMaterial({
                        transparent: true,
                        opacity: 0
                    });
                    
                    const brick = new THREE.Mesh(brickGeometry, material);
                    brick.position.set(-3 + col * 0.9, 2 - row * 0.4, 0);
                    brick.userData = { 
                        hit: false,
                        textureIndex: col % SVG_DATA.length // Tag brick with texture index
                    };
                    scene.add(brick);
                    bricks.push(brick);
                }
            }
        }

        // === АУДИО ФУНКЦИИ ===
        function playWallNote(note) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(midiToFreq(note), audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.7, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 2);
            
            oscillator.connect(gainNode);
            gainNode.connect(limiter);
            if (combo > 2) {
                gainNode.connect(delayInputGain);
            }
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 2);
        }

        function playBrickSound(type) {
            // FM синтез для Bell звуков
            const carrier = audioContext.createOscillator();
            const modulator = audioContext.createOscillator();
            const modulatorGain = audioContext.createGain();
            const gainNode = audioContext.createGain();

            // Выбор частот для разных типов
            const frequencies = {
                'FM1': { carrier: 440, modulator: 220, ratio: 2 },
                'FM2': { carrier: 523, modulator: 330, ratio: 1.5 },
                'FM3': { carrier: 660, modulator: 440, ratio: 1.2 },
                'FM4': { carrier: 784, modulator: 523, ratio: 1.8 }
            };

            const freq = frequencies[type];
            
            carrier.frequency.setValueAtTime(freq.carrier, audioContext.currentTime);
            modulator.frequency.setValueAtTime(freq.modulator, audioContext.currentTime);
            modulatorGain.gain.setValueAtTime(freq.carrier * freq.ratio, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);

            modulator.connect(modulatorGain);
            modulatorGain.connect(carrier.frequency);
            carrier.connect(gainNode);
            gainNode.connect(limiter);
            if (combo > 2) {
                gainNode.connect(delayInputGain);
            }

            carrier.start();
            modulator.start();
            carrier.stop(audioContext.currentTime + 1.5);
            modulator.stop(audioContext.currentTime + 1.5);
        }

        function playBrickMelody() {
            const melodyNotes = generateMelodyNotes(3 + Math.floor(Math.random() * 3));
            melodyNotes.forEach((note, index) => {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(midiToFreq(note), audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(limiter);
                    if (combo > 2) {
                        gainNode.connect(delayInputGain);
                    }
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 1);
                }, index * 300);
            });
        }

        function generateMelodyNotes(count) {
            const scale = CONFIG.SCALES[currentScale];
            const notes = [];
            for (let i = 0; i < count; i++) {
                notes.push(scale[Math.floor(Math.random() * scale.length)]);
            }
            return notes;
        }

        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function applyBounceRandomness(value) {
            const randomness = 1 + (Math.random() - 0.5) * 2 * CONFIG.BOUNCE_RANDOMNESS;
            return value * randomness;
        }

        // === ИГРОВАЯ ЛОГИКА ===
        function update() {
            // Управление ракеткой
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                paddle.position.x -= 0.15;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                paddle.position.x += 0.15;
            }

            // Ограничение движения ракетки
            paddle.position.x = Math.max(-3.5, Math.min(3.5, paddle.position.x));

            const speedMultiplier = Math.min(1 + gameTime * CONFIG.SPEED_INCREASE, CONFIG.MAX_SPEED / CONFIG.BALL_BASE_SPEED);

            // --- Modulate Tape Delay Time ---
            if (delay) {
                const maxSpeedMultiplier = CONFIG.MAX_SPEED / CONFIG.BALL_BASE_SPEED;
                const normalizedSpeed = maxSpeedMultiplier > 1 ? (speedMultiplier - 1) / (maxSpeedMultiplier - 1) : 0;

                // Map normalized speed [0, 1] to a very wide delay time range for dramatic effect
                const newDelayTime = 0.1 + normalizedSpeed * 5.8; // Range: 0.1s to 5.9s

                // Set value directly to create "pitch-drop" artifacts, as requested
                delay.delayTime.value = newDelayTime;
            }
            // --- End Modulation ---

            if (isBallLaunched) {
                // Движение мяча
                gameTime += 0.016;

                ball.position.x += ballVelocity.x * speedMultiplier;
                ball.position.y += ballVelocity.y * speedMultiplier;

                // Проверка столкновений
                checkCollisions();
            } else {
                // Мяч следует за ракеткой
                ball.position.x = paddle.position.x;
                ball.position.y = paddle.position.y + 0.15;
            }

            // Обновление UI
            document.getElementById('score').textContent = `Счёт: ${score}`;
            document.getElementById('combo').textContent = `Комбо: ${combo}`;
            document.getElementById('speed').textContent = `Скорость: ${speedMultiplier.toFixed(1)}x`;
        }

        function checkCollisions() {
            // Столкновение со стенами
            if (ball.position.x <= -3.9 || ball.position.x >= 3.9) {
                ballVelocity.x = applyBounceRandomness(-ballVelocity.x);
                const wallZone = Math.floor((ball.position.y + 4) / (8 / CONFIG.WALL_ZONES));
                const noteIndex = Math.min(wallZone, CONFIG.WALL_NOTES.length - 1);
                playWallNote(CONFIG.WALL_NOTES[noteIndex]);
                combo = 0;
            }

            if (ball.position.y >= 3.9) {
                ballVelocity.y = applyBounceRandomness(-ballVelocity.y);
                playWallNote(CONFIG.WALL_NOTES[Math.floor(Math.random() * CONFIG.WALL_NOTES.length)]);
                combo = 0;
            }

            // Падение мяча
            if (ball.position.y <= -4.1) {
                resetBall();
                combo = 0;
            }

            // Столкновение с ракеткой
            if (ballVelocity.y < 0 &&
                ball.position.y <= -3.35 &&
                ball.position.y >= -3.65 &&
                Math.abs(ball.position.x - paddle.position.x) <= 0.6) {
                
                ball.position.y = -3.34; // Prevent sticking
                ballVelocity.y = applyBounceRandomness(-ballVelocity.y);
                // Изменение угла в зависимости от места удара
                const hitPosition = (ball.position.x - paddle.position.x) / 0.6;
                ballVelocity.x = hitPosition * CONFIG.BALL_BASE_SPEED * 2;
                
                combo++;
                if (combo >= 3) {
                    playBrickMelody();
                }
            }

            // Столкновение с кирпичами
            bricks.forEach(brick => {
                if (!brick.userData.hit && 
                    Math.abs(ball.position.x - brick.position.x) < 0.5 &&
                    Math.abs(ball.position.y - brick.position.y) < 0.25) {
                    
                    brick.userData.hit = true;
                    brick.visible = false;
                    
                    ballVelocity.y = applyBounceRandomness(-ballVelocity.y);
                    
                    combo++;
                    score += 10;

                    playBrickSound('FM1'); // Play a default sound for all bricks
                    playBrickMelody();
                }
            });
        }

        function resetBall() {
            isBallLaunched = false;
            ballVelocity = { x: 0, y: 0 };
        }

        // === РЕНДЕРИНГ ===
        function animate() {
            requestAnimationFrame(animate);

            // --- Camera Orbit ---
            const rotSpeed = 0.0005;
            const x = camera.position.x;
            const z = camera.position.z;
            camera.position.x = x * Math.cos(rotSpeed) + z * Math.sin(rotSpeed);
            camera.position.z = z * Math.cos(rotSpeed) - x * Math.sin(rotSpeed);
            camera.lookAt(scene.position);
            // --- End Camera Orbit ---

            update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // === ЗАПУСК ===
        window.addEventListener('load', init);
    </script>
</body>
</html>
